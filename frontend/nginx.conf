# Nginx à l'intérieur du conteneur frontend.
# Sert le build React ET fait office de reverse proxy vers le conteneur
# backend (résolu par le DNS interne de Docker Compose sous le nom
# "backend") — un seul point d'entrée public, le backend n'est jamais
# exposé directement sur le réseau.
# À placer dans frontend/nginx.conf

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Application React (routage côté client avec react-router-dom)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy vers l'API Express (conteneur "backend", port 3001)
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 5M;
}
