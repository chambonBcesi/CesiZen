name: Security Audit - CESIZen

# Portail de sécurité de l'environnement de STAGING (recette). Se déclenche :
#   - à chaque push sur "staging"             -> audits + déploiement staging
#   - à chaque Pull Request vers staging/main -> audits uniquement (gate
#     obligatoire avant fusion, à configurer en "required status check"
#     dans les règles de protection de branche)
#
# 4 contrôles indépendants, tous doivent être verts avant tout déploiement :
#   1. npm audit (backend + frontend)        - dépendances vulnérables
#   2. CodeQL                                 - analyse statique du code (SAST)
#   3. Trivy                                  - scan des images Docker construites
#   4. Détection de secrets (gitleaks)        - clés/mots de passe committés par erreur
#
# Secrets/Variables nécessaires pour le job de déploiement staging (étape 9) :
# PROD_HOST, PROD_USER, PROD_SSH_KEY (les mêmes que pour la production, même
# VPS) + STAGING_APP_PATH (un clone du dépôt SÉPARÉ de celui de la prod, ex:
# /var/www/cesizen-staging) + variable STAGING_PUBLIC_URL.

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]

env:
  REGISTRY: ghcr.io

jobs:
  npm-audit:
    name: Audit des dépendances (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Backend
        working-directory: ./backend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm audit --audit-level=high

  codeql:
    name: Analyse statique du code (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  trivy-images:
    name: Scan des images Docker (Trivy) - ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image (local, non publiée)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: false
          load: true
          tags: cesizen-${{ matrix.image }}:audit

      - name: Scan Trivy - rapport complet (non bloquant, visible dans l'onglet Security)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cesizen-${{ matrix.image }}:audit
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Publication du rapport dans l'onglet Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: "trivy-${{ matrix.image }}"

      - name: Scan Trivy - porte bloquante (échoue uniquement sur criticité CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cesizen-${{ matrix.image }}:audit
          format: table
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

  secret-scan:
    name: Détection de secrets committés (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : un secret peut avoir été commité puis retiré

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo -v --redact

  deploy-staging:
    name: Déploiement sur l'environnement de test (staging)
    needs: [npm-audit, codeql, trivy-images, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normaliser le nom du propriétaire (minuscules)
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build et push - image backend (tag staging)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cesizen-backend:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cesizen-backend:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build et push - image frontend (tag staging)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.STAGING_PUBLIC_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cesizen-frontend:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cesizen-frontend:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Déploiement via SSH (stack staging, isolée de la prod)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.STAGING_APP_PATH }}
            git fetch origin staging
            git checkout staging 2>/dev/null || git checkout -b staging origin/staging
            git reset --hard origin/staging
            docker compose -p cesizen-staging --env-file .env.staging pull
            docker compose -p cesizen-staging --env-file .env.staging up -d
            docker image prune -f

      - name: Vérification post-déploiement (health check staging)
        run: |
          sleep 5
          curl -f ${{ vars.STAGING_PUBLIC_URL }}/api/health || exit 1
